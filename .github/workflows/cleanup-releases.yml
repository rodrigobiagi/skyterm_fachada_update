name: Limpar Releases e Tags Antigas

on:
  # Publicações devem preservar releases e tags anteriores para recuperação.
  # Limpeza somente por solicitação manual explícita na aba Actions.
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete older releases and tags
        uses: jay2610/delete-older-releases@1.4.0
        with:
          keep_latest: 10
          delete_tags: true
          delete_type: 'release'
          delete_branch: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
