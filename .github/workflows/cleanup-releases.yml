name: Limpar Releases e Tags Antigas

on:
  # Roda automaticamente toda vez que uma nova release for publicada
  release:
    types: [published]
  # Também permite executar manualmente pela aba "Actions" no GitHub
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Delete older releases and tags
        uses: jay2610/delete-older-releases@1.4.0
        with:
          keep_latest: 10
          delete_tags: true
          delete_type: 'release'
          delete_branch: 'main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
